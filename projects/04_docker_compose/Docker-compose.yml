# Compose: one YAML instead of many `docker run` commands.
# `docker compose up` starts every service and puts them on one network.
# Service names (mysql_container, flask_container) are DNS names on that network.

version: '3.1'

services:

  # No mysql/Dockerfile — `image:` pulls mysql:8.0 from Docker Hub and runs it.
  # Env, command, ports, and the init script below replace what that Dockerfile did.
  mysql_container:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: demopassword
      MYSQL_DATABASE: demodb
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Volume = host path mapped into the container. Storage/volumes covered next.
    volumes:
      - ./MySQL/init.sql:/docker-entrypoint-initdb.d/init.sql

  # `build:` uses a local Dockerfile (Flask/). Opposite of MySQL's `image:` pull.
  flask_container:
    build: Flask/.
    container_name: flask_container
    restart: always
    depends_on:
      mysql_container:
        condition: service_healthy
    ports:
      - "5000:5000"
